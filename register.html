<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create New Account - BookHeaven Bookstore</title>
  <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
  
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/navbar.css">
  <link rel="stylesheet" href="assets/css/footer.css">
  <link rel="stylesheet" href="assets/css/auth.css">
  <link rel="stylesheet" href="assets/css/utilities.css">
  <link rel="stylesheet" href="assets/css/animations.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body>

  <div id="navbar-container"></div>

  <main class="page-content">
    
    <section class="container auth-wrapper">
      <div class="auth-card fade-in">
        
        <!-- Header -->
        <div class="auth-header">
          <h2>Create Account</h2>
          <p>Already have an account? <a href="login.html">Sign in here</a></p>
        </div>

        <!-- Registration Form -->
        <form id="register-form" novalidate>
          
          <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" class="form-control" placeholder="John Doe" required autocomplete="name">
          </div>

          <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" class="form-control" placeholder="john@example.com" required autocomplete="email">
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" class="form-control" placeholder="••••••••" required autocomplete="new-password">
            <!-- Password Strength Indicator -->
            <div class="password-strength-wrapper">
              <div class="password-strength-bar">
                <div class="password-strength-fill" id="strength-fill"></div>
              </div>
              <span class="password-strength-text" id="strength-text">Strength: None</span>
            </div>
          </div>

          <div class="form-group">
            <label for="confirm-password">Confirm Password</label>
            <input type="password" id="confirm-password" class="form-control" placeholder="••••••••" required autocomplete="new-password">
          </div>

          <button type="submit" class="btn btn-primary auth-submit-btn">
            Create Account <i class="ri-user-add-line"></i>
          </button>

        </form>

      </div>
    </section>

  </main>

  <div id="footer-container"></div>

  <!-- JS Engines -->
  <script src="assets/js/utils.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/validation.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/books.js"></script>
  <script src="assets/js/cart.js"></script>
  <script src="assets/js/wishlist.js"></script>
  <script src="assets/js/auth.js"></script>
</body>
</html>
