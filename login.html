<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account Sign In - BookHeaven Bookstore</title>
  <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
  
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/navbar.css">
  <link rel="stylesheet" href="assets/css/footer.css">
  <link rel="stylesheet" href="assets/css/auth.css">
  <link rel="stylesheet" href="assets/css/utilities.css">
  <link rel="stylesheet" href="assets/css/animations.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body>

  <div id="navbar-container"></div>

  <main class="page-content">
    
    <section class="container auth-wrapper">
      <div class="auth-card fade-in">
        
        <!-- Header -->
        <div class="auth-header">
          <h2>Welcome Back</h2>
          <p>Don't have an account yet? <a href="register.html">Register here</a></p>
        </div>

        <!-- Login Form -->
        <form id="login-form" novalidate>
          
          <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" class="form-control" placeholder="john@example.com" required autocomplete="email">
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
          </div>

          <div class="form-options">
            <label class="remember-me">
              <input type="checkbox"> Remember me
            </label>
            <a href="#" class="forgot-password-link" onclick="Toast.info('Password reset is simulated. Try john@example.com / Password123')">Forgot Password?</a>
          </div>

          <button type="submit" class="btn btn-primary auth-submit-btn">
            Sign In <i class="ri-login-box-line"></i>
          </button>

        </form>

        <!-- Quick Help Box -->
        <div style="margin-top: 2rem; padding: 1rem; background-color: var(--secondary-color); border-radius: var(--border-radius-sm); border: 1px solid var(--border-color); font-size: 0.8rem; text-align: center;">
          <strong class="text-primary">Simulated Account Credentials:</strong><br>
          Email: <code>john@example.com</code> / Password: <code>Password123</code>
        </div>

      </div>
    </section>

  </main>

  <div id="footer-container"></div>

  <!-- JS Engines -->
  <script src="assets/js/utils.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/validation.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/books.js"></script>
  <script src="assets/js/cart.js"></script>
  <script src="assets/js/wishlist.js"></script>
  <script src="assets/js/auth.js"></script>
</body>
</html>
