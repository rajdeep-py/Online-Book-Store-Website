<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout - BookHeaven Bookstore</title>
  <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
  
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/navbar.css">
  <link rel="stylesheet" href="assets/css/footer.css">
  <link rel="stylesheet" href="assets/css/checkout.css">
  <link rel="stylesheet" href="assets/css/utilities.css">
  <link rel="stylesheet" href="assets/css/animations.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body>

  <div id="navbar-container"></div>

  <main class="page-content">
    
    <!-- Breadcrumbs Navigation -->
    <div class="breadcrumb-wrapper">
      <div class="container">
        <ul class="breadcrumb">
          <li><a href="index.html">Home</a></li>
          <li><a href="cart.html">Shopping Cart</a></li>
          <li>Checkout</li>
        </ul>
      </div>
    </div>

    <!-- Checkout Main layout -->
    <section class="container" style="padding-bottom: 5rem;">
      <h2 class="mb-4" style="font-size: 2rem; font-weight: 800;">Secure Checkout</h2>
      
      <div class="checkout-wrapper">
        <!-- Left Column: Shipping & Payment details form -->
        <form class="checkout-form-container" id="checkout-form" novalidate>
          
          <!-- Shipping Address Card -->
          <div class="checkout-card">
            <h3 class="checkout-card-title">
              <i class="ri-map-pin-line"></i> Shipping Address
            </h3>
            
            <div class="form-group">
              <label for="fullName">Full Name</label>
              <input type="text" id="fullName" class="form-control" placeholder="John Doe">
            </div>

            <div class="form-group">
              <label for="street">Street Address</label>
              <input type="text" id="street" class="form-control" placeholder="123 Library Lane">
            </div>

            <div class="form-row">
              <div class="form-group">
                <label for="city">City</label>
                <input type="text" id="city" class="form-control" placeholder="Booktown">
              </div>
              <div class="form-group">
                <label for="zipCode">Zip Code / Pin Code</label>
                <input type="text" id="zipCode" class="form-control" placeholder="10001">
              </div>
            </div>

            <div class="form-group">
              <label for="phone">Phone Number</label>
              <input type="text" id="phone" class="form-control" placeholder="+91 9876543210">
            </div>
          </div>

          <!-- Payment Method Card -->
          <div class="checkout-card">
            <h3 class="checkout-card-title">
              <i class="ri-bank-card-line"></i> Payment Method
            </h3>

            <div class="payment-methods-grid">
              <!-- COD Choice -->
              <div class="payment-method-card active" id="pm-cod">
                <i class="ri-hand-coin-line"></i>
                <span>Cash on Delivery</span>
              </div>
            </div>
          </div>

          <!-- Place Order Button -->
          <button type="submit" class="btn btn-primary" style="width: 100%; padding: 1rem; font-size: 1.1rem; box-shadow: var(--shadow-primary);">
            <i class="ri-shield-check-line"></i> Place Secure Order
          </button>

        </form>

        <!-- Right Column: Order Review Sidebar -->
        <div class="checkout-order-review">
          <div class="summary-card">
            <h3 class="summary-title" style="margin-bottom: 1.25rem;">Review Items</h3>
            
            <!-- Compact items list -->
            <div class="review-items-list" id="review-items-list">
              <!-- Dynamically populated via checkout.js -->
            </div>

            <div class="summary-row">
              <span>Subtotal</span>
              <span id="checkout-subtotal">₹0</span>
            </div>
            <div class="summary-row">
              <span>Delivery Charges</span>
              <span id="checkout-shipping">₹0</span>
            </div>

            <div class="summary-row total-row" style="margin-top: 1.25rem; padding-top: 1.25rem;">
              <span>Grand Total</span>
              <span id="checkout-total">₹0</span>
            </div>
          </div>
        </div>

      </div>
    </section>

  </main>

  <div id="footer-container"></div>

  <!-- JS Engines -->
  <script src="assets/js/utils.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/validation.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/books.js"></script>
  <script src="assets/js/cart.js"></script>
  <script src="assets/js/wishlist.js"></script>
  <script src="assets/js/checkout.js"></script>
</body>
</html>
