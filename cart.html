<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart - BookHeaven Bookstore</title>
  <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
  
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/navbar.css">
  <link rel="stylesheet" href="assets/css/footer.css">
  <link rel="stylesheet" href="assets/css/cart.css">
  <link rel="stylesheet" href="assets/css/utilities.css">
  <link rel="stylesheet" href="assets/css/animations.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body>

  <div id="navbar-container"></div>

  <main class="page-content">
    
    <!-- Breadcrumbs Navigation -->
    <div class="breadcrumb-wrapper">
      <div class="container">
        <ul class="breadcrumb">
          <li><a href="index.html">Home</a></li>
          <li>Shopping Cart</li>
        </ul>
      </div>
    </div>

    <!-- Cart Layout Grid -->
    <section class="container" style="padding-bottom: 5rem;">
      <h2 class="mb-4" style="font-size: 2rem; font-weight: 800;">Your Shopping Cart</h2>
      
      <div class="cart-wrapper">
        <!-- Left Side: Cart Items Lists -->
        <div class="cart-items-container" id="cart-items-container">
          <!-- Dynamically populated via cart.js -->
        </div>

        <!-- Right Side: Pricing Summaries -->
        <div class="order-summary-sidebar" id="order-summary-container">
          <!-- Dynamically populated via cart.js -->
        </div>
      </div>
    </section>

  </main>

  <div id="footer-container"></div>

  <!-- JS Engines -->
  <script src="assets/js/utils.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/validation.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/books.js"></script>
  <script src="assets/js/cart.js"></script>
  <script src="assets/js/wishlist.js"></script>
</body>
</html>
