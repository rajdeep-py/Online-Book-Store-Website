<!-- Reference Template for Book Card rendering -->
<div class="book-card" data-id="1">
  <div class="book-card-image-box">
    <img src="assets/images/books/atomic-habits.jpg" alt="Atomic Habits">
    <!-- Wishlist Button -->
    <button class="wishlist-toggle-btn" data-id="1" title="Add to Wishlist">
      <i class="ri-heart-line"></i>
    </button>
  </div>
  <div class="book-card-body">
    <span class="book-card-category">Self Help</span>
    <h4 class="book-card-title"><a href="book-details.html?id=1">Atomic Habits</a></h4>
    <p class="book-card-author">By James Clear</p>
    <div class="book-card-rating">
      <div class="rating-stars">
        <i class="ri-star-fill"></i>
        <i class="ri-star-fill"></i>
        <i class="ri-star-fill"></i>
        <i class="ri-star-fill"></i>
        <i class="ri-star-half-fill"></i>
      </div>
      <span class="rating-number">4.8</span>
    </div>
    <div class="book-card-footer">
      <span class="book-card-price">₹499</span>
      <button class="btn btn-primary add-to-cart-btn" data-id="1">
        <i class="ri-shopping-bag-line"></i> Add
      </button>
    </div>
  </div>
</div>
